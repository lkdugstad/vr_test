<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>VR-Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #05070D">
      <a-box position="-1 1.5 -3" rotation="0 45 0" color="#7FB2E8"></a-box>
      <a-sphere position="0 1.5 -4" radius="0.8" color="#FFC04D"></a-sphere>
      <a-cylinder position="1 1.2 -3" radius="0.5" height="1.2" color="#35D6C2"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#0a1430"></a-plane>

      <a-text value="A-Frame laeuft!" position="0 2.6 -3" align="center" color="#EAF2FF" width="6"></a-text>

      <a-camera></a-camera>
    </a-scene>
  </body>
</html>
