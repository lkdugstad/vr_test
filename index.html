<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>VR-Test · Holo-Graph</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      #cardboard-btn {
        position: fixed; right: 14px; bottom: 14px; z-index: 9999;
        font-family: system-ui, sans-serif; font-size: 15px; letter-spacing: 0.5px;
        color: #eaf2ff; background: rgba(18, 50, 92, 0.85);
        border: 1px solid #7fb2e8; border-radius: 9px; padding: 11px 18px;
        box-shadow: 0 0 18px rgba(60, 150, 255, 0.45);
      }
      /* Im Stereo-Modus eine dezente Mittellinie als Trennung der Augen */
      body.vr-active::after {
        content: ""; position: fixed; top: 0; bottom: 0; left: 50%; width: 1px;
        background: rgba(127, 178, 232, 0.25); z-index: 9998; pointer-events: none;
      }
    </style>

    <script>
      /* global AFRAME, THREE */

      // Weiche, runde Glow-Textur (radial) fuer leuchtende Punkte ----------
      function makeGlowTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 64;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0.0, "rgba(255,255,255,1)");
        g.addColorStop(0.2, "rgba(210,235,255,0.95)");
        g.addColorStop(0.5, "rgba(120,180,255,0.35)");
        g.addColorStop(1.0, "rgba(120,180,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      }

      // ====================================================================
      //  iron-graph: erzeugt eine leuchtende Knoten-Wolke + Verbindungsnetz
      //  rund um den Nutzer, plus rotierende "Elektronenbahn"-Ringe.
      // ====================================================================
      AFRAME.registerComponent("iron-graph", {
        schema: {
          nodes: { default: 90 },
          rMin: { default: 2.8 },
          rMax: { default: 7.0 },
        },

        init() {
          const N = this.data.nodes;
          const tex = makeGlowTexture();

          // Gruppe sitzt auf Augenhoehe -> Nutzer steht in der Mitte
          this.group = new THREE.Group();
          this.group.position.set(0, 1.6, 0);
          this.el.setObject3D("graph", this.group);

          // --- Farbpalette (ueberwiegend kuehles Blau, Akzente Cyan/Gold) --
          const C_BLUE = new THREE.Color("#7FB2E8");
          const C_LIGHT = new THREE.Color("#bfe0ff");
          const C_CYAN = new THREE.Color("#35D6C2");
          const C_GOLD = new THREE.Color("#FFC04D");
          const pick = () => {
            const r = Math.random();
            if (r < 0.08) return C_GOLD;
            if (r < 0.24) return C_CYAN;
            if (r < 0.55) return C_LIGHT;
            return C_BLUE;
          };

          // --- Knoten gleichmaessig in einer Kugelschale verteilen ---------
          const pts = [];
          const nodePos = new Float32Array(N * 3);
          const nodeCol = new Float32Array(N * 3);
          for (let i = 0; i < N; i++) {
            const u = Math.random(), v = Math.random();
            const th = 2 * Math.PI * u;
            const ph = Math.acos(2 * v - 1);
            const r = this.data.rMin + Math.random() * (this.data.rMax - this.data.rMin);
            const x = r * Math.sin(ph) * Math.cos(th);
            const y = r * Math.cos(ph) * 0.75; // vertikal etwas stauchen -> Scheibe/Atom
            const z = r * Math.sin(ph) * Math.sin(th);
            pts.push(new THREE.Vector3(x, y, z));
            nodePos.set([x, y, z], i * 3);
            const col = pick();
            nodeCol.set([col.r, col.g, col.b], i * 3);
          }

          const nodeGeo = new THREE.BufferGeometry();
          nodeGeo.setAttribute("position", new THREE.BufferAttribute(nodePos, 3));
          nodeGeo.setAttribute("color", new THREE.BufferAttribute(nodeCol, 3));
          const nodeMat = new THREE.PointsMaterial({
            size: 0.9, map: tex, vertexColors: true,
            transparent: true, blending: THREE.AdditiveBlending,
            depthWrite: false, sizeAttenuation: true,
          });
          this.nodes = new THREE.Points(nodeGeo, nodeMat);
          this.group.add(this.nodes);

          // --- Verbindungsnetz: jeder Knoten zu seinen 2 naechsten ---------
          const seen = new Set();
          const linePos = [];
          const lineCol = [];
          for (let i = 0; i < N; i++) {
            const d = [];
            for (let j = 0; j < N; j++) {
              if (i === j) continue;
              d.push([j, pts[i].distanceToSquared(pts[j])]);
            }
            d.sort((a, b) => a[1] - b[1]);
            for (let k = 0; k < 2; k++) {
              const j = d[k][0];
              const key = i < j ? i + "_" + j : j + "_" + i;
              if (seen.has(key)) continue;
              seen.add(key);
              linePos.push(pts[i].x, pts[i].y, pts[i].z, pts[j].x, pts[j].y, pts[j].z);
              for (let e = 0; e < 2; e++) lineCol.push(0.35, 0.6, 0.95); // gedaempftes Blau
            }
          }
          const lineGeo = new THREE.BufferGeometry();
          lineGeo.setAttribute("position", new THREE.Float32BufferAttribute(linePos, 3));
          lineGeo.setAttribute("color", new THREE.Float32BufferAttribute(lineCol, 3));
          const lineMat = new THREE.LineBasicMaterial({
            vertexColors: true, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false,
          });
          this.links = new THREE.LineSegments(lineGeo, lineMat);
          this.group.add(this.links);

          // --- "Elektronenbahn"-Ringe (Arc-Reactor-Feeling) ---------------
          this.rings = [];
          const ringColors = ["#7FB2E8", "#35D6C2", "#9fd0ff"];
          for (let i = 0; i < 3; i++) {
            const R = 4.2 + i * 0.9;
            const geo = new THREE.TorusGeometry(R, 0.012, 8, 140);
            const mat = new THREE.MeshBasicMaterial({
              color: new THREE.Color(ringColors[i]),
              transparent: true, opacity: 0.5,
              blending: THREE.AdditiveBlending, depthWrite: false,
            });
            const ring = new THREE.Mesh(geo, mat);
            ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            ring.userData.spd = 0.00018 + Math.random() * 0.00022;
            ring.userData.axis = i % 2 === 0 ? "x" : "y";
            this.group.add(ring);
            this.rings.push(ring);
          }

          // --- Kern-Glow in der Mitte (Reaktor) ----------------------------
          const coreGeo = new THREE.BufferGeometry();
          coreGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
          this.coreMat = new THREE.PointsMaterial({
            size: 5.5, map: tex, color: new THREE.Color("#dff0ff"),
            transparent: true, blending: THREE.AdditiveBlending,
            depthWrite: false, sizeAttenuation: true,
          });
          this.core = new THREE.Points(coreGeo, this.coreMat);
          this.group.add(this.core);
        },

        tick(time, dt) {
          if (!this.group) return;
          // Gesamtrotation: langsam, leichte Neigung
          this.group.rotation.y += dt * 0.00006;
          this.group.rotation.x = 0.12 * Math.sin(time * 0.00008);
          // Ringe einzeln drehen
          for (const ring of this.rings) {
            ring.rotation[ring.userData.axis] += dt * ring.userData.spd;
          }
          // Kern pulsiert sanft
          if (this.coreMat) this.coreMat.size = 5.5 + 1.4 * Math.sin(time * 0.0018);
        },

        remove() {
          this.el.removeObject3D("graph");
        },
      });

      // ====================================================================
      //  cardboard: manueller Stereo-Split fuer iOS-Safari (kein WebXR noetig)
      //  Rendert die Szene in zwei Viewports (linkes/rechtes Auge). Das
      //  Kopf-Tracking kommt weiter von A-Frames look-controls (Gyroskop).
      // ====================================================================
      AFRAME.registerComponent("cardboard", {
        init() {
          this.active = false;
          this.stereo = new THREE.StereoCamera();
          this.stereo.aspect = 0.5;
          this.stereo.eyeSep = 0.064;
          this.size = new THREE.Vector2();

          if (this.el.renderer) this.patchRenderer();
          else this.el.addEventListener("loaded", () => this.patchRenderer(), { once: true });

          this.btn = document.getElementById("cardboard-btn");
          this.btn.addEventListener("click", () => this.toggle());
        },

        patchRenderer() {
          const renderer = this.el.renderer;
          const realRender = renderer.render.bind(renderer);
          const self = this;
          renderer.render = function (scene, camera) {
            renderer.getSize(self.size);
            const w = self.size.width, h = self.size.height;
            if (!self.active) {
              // sicherstellen, dass der Viewport voll ist (nach Stereo-Frame)
              renderer.setScissorTest(false);
              renderer.setViewport(0, 0, w, h);
              realRender(scene, camera);
              return;
            }
            scene.updateMatrixWorld();
            self.stereo.update(camera);
            if (renderer.autoClear) renderer.clear();
            renderer.setScissorTest(true);
            renderer.setScissor(0, 0, w / 2, h);
            renderer.setViewport(0, 0, w / 2, h);
            realRender(scene, self.stereo.cameraL);
            renderer.setScissor(w / 2, 0, w / 2, h);
            renderer.setViewport(w / 2, 0, w / 2, h);
            realRender(scene, self.stereo.cameraR);
            renderer.setScissorTest(false);
          };
        },

        toggle() {
          this.active = !this.active;
          this.btn.textContent = this.active ? "✕ Stereo beenden" : "⛶ Cardboard";
          document.body.classList.toggle("vr-active", this.active);
          if (this.active) window.scrollTo(0, 1); // Adressleiste verstecken
        },
      });

      // ====================================================================
      //  gaze-menu: per Blick bedienbares Menue. Ein "MENU"-Button oeffnet
      //  vier weitere Buttons (Ball / roter Zylinder / Kaefig / Schliessen).
      //  Buttons tragen class "gaze"; der a-cursor feuert per Fuse 'click'.
      // ====================================================================
      AFRAME.registerComponent("gaze-menu", {
        init() {
          this.open = false;
          this.cageOn = false;
          this.sceneEl = this.el.sceneEl;
          this._p = new THREE.Vector3();
          this._d = new THREE.Vector3();

          const main = this.makeButton("MENU", () => this.toggleMenu(), "#1a4a85");
          main.setAttribute("position", "0 0 0");
          this.el.appendChild(main);

          this.sub = null;
          this.items = [
            ["+ Ball", () => this.spawnBall()],
            ["+ Zylinder (rot)", () => this.spawnCylinder()],
            ["Kaefig an/aus", () => this.toggleCage()],
            ["Schliessen", () => this.toggleMenu(false)],
          ];

          this.buildCage();
        },

        // Untermenue beim Oeffnen bauen, beim Schliessen entfernen -> es ist
        // nur dann im Raycaster, wenn es auch sichtbar ist.
        toggleMenu(force) {
          const want = force === undefined ? !this.open : force;
          if (want === this.open) return;
          this.open = want;
          if (this.open) {
            this.sub = document.createElement("a-entity");
            this.items.forEach(([label, fn], i) => {
              const b = this.makeButton(label, fn);
              b.setAttribute("position", "0 " + (-0.34 * (i + 1)) + " 0");
              this.sub.appendChild(b);
            });
            this.el.appendChild(this.sub);
          } else if (this.sub) {
            this.sub.remove();
            this.sub = null;
          }
        },

        makeButton(label, onClick, color = "#12325c") {
          const w = 1.1, h = 0.26;
          const btn = document.createElement("a-entity");
          btn.classList.add("gaze");

          const border = document.createElement("a-plane");
          border.setAttribute("width", w + 0.04);
          border.setAttribute("height", h + 0.04);
          border.setAttribute("position", "0 0 -0.01");
          border.setAttribute("material", "shader: flat; color: #7fb2e8; opacity: 0.5; side: double; transparent: true");
          btn.appendChild(border);

          const bg = document.createElement("a-plane");
          bg.setAttribute("width", w);
          bg.setAttribute("height", h);
          bg.setAttribute("material", "shader: flat; color: " + color + "; opacity: 0.9; side: double; transparent: true");
          btn.appendChild(bg);

          const t = document.createElement("a-entity");
          t.setAttribute("text", { value: label, align: "center", color: "#eaf2ff", width: 1 });
          t.setAttribute("position", "0 0 0.01");
          btn.appendChild(t);

          // Events bubblen von den Kind-Meshes hoch zum Button
          btn.addEventListener("mouseenter", () => bg.setAttribute("material", "color", "#2a78c8"));
          btn.addEventListener("mouseleave", () => bg.setAttribute("material", "color", color));
          btn.addEventListener("click", onClick);
          return btn;
        },

        spawnInFront(el, dist = 2.5) {
          const cam = this.sceneEl.camera;
          cam.getWorldPosition(this._p);
          cam.getWorldDirection(this._d);
          this._p.addScaledVector(this._d, dist);
          el.setAttribute("position", this._p.x + " " + this._p.y + " " + this._p.z);
          this.sceneEl.appendChild(el);
        },

        spawnBall() {
          const s = document.createElement("a-sphere");
          s.setAttribute("radius", 0.4);
          s.setAttribute("material", "shader: standard; color: #7FB2E8; emissive: #2b6fd6; emissiveIntensity: 0.6; metalness: 0.3; roughness: 0.4");
          this.spawnInFront(s);
        },

        spawnCylinder() {
          const c = document.createElement("a-cylinder");
          c.setAttribute("radius", 0.32);
          c.setAttribute("height", 1.2);
          c.setAttribute("material", "shader: standard; color: #FF4D5E; emissive: #b3202e; emissiveIntensity: 0.5; metalness: 0.3; roughness: 0.4");
          this.spawnInFront(c);
        },

        buildCage() {
          const cage = document.createElement("a-entity");
          cage.setAttribute("position", "0 1.6 0");
          cage.setAttribute("visible", "false");
          const R = 1.7, barH = 2.6, bars = 14;
          const mat = "shader: flat; color: #7FB2E8; opacity: 0.8; transparent: true";
          for (let k = 0; k < bars; k++) {
            const a = (k / bars) * Math.PI * 2;
            const bar = document.createElement("a-cylinder");
            bar.setAttribute("radius", 0.025);
            bar.setAttribute("height", barH);
            bar.setAttribute("position", (R * Math.cos(a)) + " 0 " + (R * Math.sin(a)));
            bar.setAttribute("material", mat);
            cage.appendChild(bar);
          }
          for (const y of [1.25, -1.25]) {
            const ring = document.createElement("a-torus");
            ring.setAttribute("radius", R);
            ring.setAttribute("radius-tubular", 0.03);
            ring.setAttribute("rotation", "90 0 0");
            ring.setAttribute("position", "0 " + y + " 0");
            ring.setAttribute("material", mat);
            cage.appendChild(ring);
          }
          this.sceneEl.appendChild(cage);
          this.cage = cage;
        },

        toggleCage() {
          this.cageOn = !this.cageOn;
          this.cage.setAttribute("visible", this.cageOn);
        },
      });

      // Sternenfeld als ruhiger Hintergrund -------------------------------
      AFRAME.registerComponent("stars", {
        init() {
          const n = 1200, pos = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) {
            const u = Math.random(), v = Math.random();
            const th = 2 * Math.PI * u, ph = Math.acos(2 * v - 1);
            const r = 22 + Math.random() * 14;
            pos.set([
              r * Math.sin(ph) * Math.cos(th),
              r * Math.cos(ph),
              r * Math.sin(ph) * Math.sin(th),
            ], i * 3);
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          const mat = new THREE.PointsMaterial({
            color: 0x9fc4ff, size: 0.13, transparent: true,
            opacity: 0.7, depthWrite: false,
          });
          this.p = new THREE.Points(geo, mat);
          this.el.setObject3D("stars", this.p);
        },
        tick(time) { if (this.p) this.p.rotation.y = time * 0.000004; },
      });
    </script>
  </head>

  <body>
    <button id="cardboard-btn">⛶ Cardboard</button>

    <a-scene
      background="color: #05070D"
      renderer="colorManagement: true; antialias: true"
      device-orientation-permission-ui="enabled: true"
      vr-mode-ui="enabled: false"
      cardboard>

      <a-entity stars></a-entity>
      <a-entity iron-graph></a-entity>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls="pointerLockEnabled: false" wasd-controls-enabled="false">
          <a-cursor
            fuse="true"
            fuse-timeout="900"
            raycaster="objects: .gaze; far: 30"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #9fd0ff; shader: flat; opacity: 0.9"
            animation__fuse="property: scale; startEvents: fusing; from: 1 1 1; to: 0.3 0.3 0.3; dur: 900; easing: easeInQuad"
            animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 150">
          </a-cursor>
        </a-camera>

        <!-- Welt-fixes Gaze-Menue vor dem Nutzer -->
        <a-entity gaze-menu position="0 1.45 -2"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
